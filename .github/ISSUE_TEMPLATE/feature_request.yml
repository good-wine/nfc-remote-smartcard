name: Feature request
description: Proponi una funzionalità o un miglioramento.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Prima di proporre, descrivi il **problema**, non solo la soluzione: aiuta a
        valutare alternative che non avevi considerato.

        > Per una vulnerabilità di sicurezza usa il canale privato: vedi
        > [`SECURITY.md`](https://github.com/nfc-remote/nfc-remote/blob/main/SECURITY.md).

  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Quale esigenza reale non è soddisfatta oggi? Chi ne è colpito e in quale scenario?
      placeholder: "Quando uso ... non posso ... e questo mi costringe a ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Cosa vorresti che il prodotto facesse. Sii concreto su input, output e comportamento atteso.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Componente coinvolta
      description: Dove vivrebbe la funzionalità (core, desktop, mobile, web, extension, shared-ui-ts, docs/build).
      placeholder: "desktop + web"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative considerate
      description: Workaround attuali, altre soluzioni valutate, e perché la proposta è preferibile.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope e impatto
      description: |
        Cosa entra e cosa resta fuori. Indica se tocca contratti esistenti
        (protocollo E2EE, QR di pairing, canale locale token/consenso, API `/v1/*`)
        e se introduce una decisione architetturale da documentare con un ADR.
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Conferme
      options:
        - label: Ho cercato fra le issue esistenti per non duplicare la richiesta.
          required: true
