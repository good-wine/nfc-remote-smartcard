<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>NFC Remote Mobile</title>
</head>
<body>
  <header class="app-head">
    <h1 data-i18n="app.title">NFC Remote</h1>
    <div id="status" class="status" data-state="idle" data-i18n="status.idle" aria-live="polite">Non associato</div>
  </header>

  <main class="actions">
    <button id="scan" class="primary" data-i18n="btn.scan">Scansiona QR PC</button>
    <p id="hint" class="hint" data-i18n="mobile.hint">
      Inquadra il QR mostrato nella tray del desktop: la sessione è E2EE ibrido post-quantum.
    </p>
  </main>

  <section class="panel">
    <h2 data-i18n="card.title">Carta</h2>
    <div id="card" class="card-status" data-state="none" aria-live="polite">
      <span id="card-text" data-i18n="card.none">Nessuna carta</span>
    </div>
    <p id="card-atr" class="atr" hidden></p>
  </section>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
